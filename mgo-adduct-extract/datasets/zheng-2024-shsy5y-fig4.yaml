caveats:
- 'RECONCILIATION: 152 unique gene symbols vs the 153 proteins the paper states. The most
  likely cause is a counting-unit difference -- Fig. 4 labels rows by GENE SYMBOL while the
  text counts PROTEINS (accessions), so two accessions sharing one symbol collapse to a single
  label. It cannot be resolved from the published material. Treat this as 152 of 153.'
- This file is the only source of Zheng's sole cytoplasmic ribosomal protein, RPL8 (panel
  D, Cys C-E), which is absent from Table S1.
