- carboxyethyl / hemiaminal (+72.021129 Da) on Arg, Lys, Cys
adduct_evidence: Methods 2.6, MaxQuant variable modifications with those delta masses.
output: Zheng et al. 2024 - SH-SY5Y (Fig4 recovered).tsv
expected_rows: 152
count_evidence: union of Fig. 4 panels A-D (33 / 52 / 57 / 57 labels). The paper states 153
  proteins; see caveats.
provenance: 'FIGURE-DERIVED, NOT TEXT-LAYER. Fig. 4 is a raster image with no text layer,
  so these labels were read visually from the figure rendered at 400 dpi (page 5 of the article
  PDF). The transcription was then re-read independently EIGHT times -- two blind passes per
  panel, each re-rendering from the PDF at 600-1200 dpi -- and all eight passes returned byte-identical
  label lists. Each panel''s row count was separately confirmed by pixel analysis of the heatmap
  colour bands: A=33, B=52, C=57, D=57. All 77 Table S1 genes appear in the union, which is
  a strong check that the reading is correct. Re-deriving this list requires the vision protocol
  in SKILL.md, not a parser.'
